<!-- Main Content - Viewer Section -->
<section class="viewer-stage-shell" aria-label="WoodLab 3D preview">
  <div id="viewer-frame" class="viewer-frame">
    <div id="viewer" class="viewer-surface" data-viewer-state="empty" aria-label="3D table viewer">
      <div id="viewer-canvas" class="viewer-canvas"></div>

      <div id="viewer-status-spinner" class="viewer-status-spinner" aria-hidden="true" hidden></div>

      <div id="viewer-status-box" class="viewer-status-box" hidden>
        <div class="viewer-status-box-row">
          <div class="viewer-status-box-content">
            <p id="viewer-status-box-title" class="viewer-status-box-title">Loading preview</p>
            <p id="viewer-status-box-copy" class="viewer-status-box-copy">Preparing your 3D preview.</p>
          </div>
        </div>
      </div>

      <div id="viewer-empty-state" class="viewer-overlay viewer-overlay-empty">
        <div class="viewer-overlay-card">
          <img src="assets/images/Generated%20Placeholder%20Table.png" alt="" class="viewer-empty-illustration" />
          <p class="viewer-overlay-eyebrow">WoodLab configurator</p>
          <h2 class="viewer-overlay-title">Choose a model to begin</h2>
          <p class="viewer-overlay-copy">The preview uses the local tabletop and leg models that match your current selections.</p>
        </div>
      </div>

      <div id="viewer-error-state" class="viewer-overlay viewer-overlay-error" hidden>
        <div class="viewer-overlay-card">
          <p class="viewer-overlay-eyebrow">Preview unavailable</p>
          <h2 class="viewer-overlay-title">3D preview could not be loaded</h2>
          <p id="viewer-error-copy" class="viewer-overlay-copy">Try loading the 3D preview again.</p>
          <button id="viewer-retry" type="button" class="control-btn viewer-retry-button">Retry Preview</button>
        </div>
      </div>
    </div>

    <div class="viewer-footer">
      <div id="viewer-controls-container" class="viewer-controls-container">
        <div data-include="components/ViewerControls.html"></div>
      </div>

      <div id="viewer-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </div>
  </div>

  <div id="main-stage-host" class="main-stage-host" hidden></div>
</section>
