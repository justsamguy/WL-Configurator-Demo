<!-- Stage Panels Placeholder: panels are identified by id="stage-panel-<index>" -->
<div id="stage-panels-root" class="flex flex-col gap-4 px-6 py-6">
  <!-- Stage 0: Models -->
  <section id="stage-panel-0" class="stage-panel">
    <div id="stage-0-placeholder"></div>
  </section>

  <!-- Stage 1: Designs -->
  <section id="stage-panel-1" class="stage-panel">
    <div id="stage-1-placeholder"></div>
  </section>

  <!-- Stage 2: Materials -->
  <section id="stage-panel-2" class="stage-panel">
    <!-- Materials options are provided via components/MaterialsPanel.html (included in the sidebar) -->
  </section>

  <!-- Stage 3: Finish -->
  <section id="stage-panel-3" class="stage-panel">
    <div id="finish-options" class="stage-subsection-list">
      <section id="finish-subsection-coating" class="stage-subsection-dropdown" data-default-expanded="true">
        <button type="button" class="stage-subsection-header" aria-expanded="false" aria-controls="finish-subsection-coating-content">
          <div class="stage-subsection-header-main">
            <div class="stage-subsection-title">Coating</div>
          </div>
          <svg class="stage-subsection-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <div id="finish-subsection-coating-content" class="stage-subsection-content" hidden>
          <div class="stage-subsection-body">
            <div class="stage-options-grid" id="finish-coating-options" aria-live="polite" aria-atomic="true">
              <!-- Option cards rendered at runtime from data/finish.json coatings via main.js -> stageRenderer.renderOptionCards -->
            </div>
          </div>
        </div>
      </section>

      <section id="finish-subsection-sheen" class="stage-subsection-dropdown" data-default-expanded="true">
        <button type="button" class="stage-subsection-header" aria-expanded="false" aria-controls="finish-subsection-sheen-content">
          <div class="stage-subsection-header-main">
            <div class="stage-subsection-title">Sheen</div>
          </div>
          <svg class="stage-subsection-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <div id="finish-subsection-sheen-content" class="stage-subsection-content" hidden>
          <div class="stage-subsection-body">
            <div id="finish-sheen-slider" aria-live="polite" aria-atomic="true">
              <!-- Slider rendered at runtime from data/finish.json sheens via main.js -->
            </div>
          </div>
        </div>
      </section>

      <section id="finish-subsection-tint" class="stage-subsection-dropdown" data-default-expanded="true">
        <button type="button" class="stage-subsection-header" aria-expanded="false" aria-controls="finish-subsection-tint-content">
          <div class="stage-subsection-header-main">
            <div class="stage-subsection-title">Tint</div>
          </div>
          <svg class="stage-subsection-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <div id="finish-subsection-tint-content" class="stage-subsection-content" hidden>
          <div class="stage-subsection-body">
            <div class="stage-options-grid" id="finish-tint-options" aria-live="polite" aria-atomic="true">
              <!-- Option cards rendered at runtime from data/finish.json tints via main.js -> stageRenderer.renderOptionCards -->
            </div>
          </div>
        </div>
      </section>
    </div>
  </section>

  <!-- Stage 4: Dimensions -->
  <section id="stage-panel-4" class="stage-panel">
    <div id="dimensions-panel-placeholder"></div>
  </section>

  <!-- Stage 5: Legs -->
  <section id="stage-panel-5" class="stage-panel">
    <div id="legs-price-banner" class="hidden legs-price-banner" role="status" aria-live="polite" aria-atomic="true">
      Leg prices updated automatically because we require 3 legs on tables over 130" Long.
    </div>
    <div id="legs-options-group" class="stage-subsection-list">
      <section id="legs-subsection-style" class="stage-subsection-dropdown" data-default-expanded="true">
        <button type="button" class="stage-subsection-header" aria-expanded="false" aria-controls="legs-subsection-style-content">
          <div class="stage-subsection-header-main">
            <div class="stage-subsection-title">Leg Style</div>
          </div>
          <svg class="stage-subsection-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <div id="legs-subsection-style-content" class="stage-subsection-content" hidden>
          <div class="stage-subsection-body">
            <div id="legs-options" class="stage-options-grid" aria-live="polite" aria-atomic="true">
              <!-- Option cards rendered at runtime from data/legs.json via main.js -> stageRenderer.renderOptionCards -->
            </div>
          </div>
        </div>
      </section>

      <section id="legs-subsection-tube-size" class="stage-subsection-dropdown" data-default-expanded="true">
        <button type="button" class="stage-subsection-header" aria-expanded="false" aria-controls="legs-subsection-tube-size-content">
          <div class="stage-subsection-header-main">
            <div class="stage-subsection-title">Tube size</div>
          </div>
          <svg class="stage-subsection-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <div id="legs-subsection-tube-size-content" class="stage-subsection-content" hidden>
          <div class="stage-subsection-body">
            <div id="tube-size-options" class="stage-options-grid" aria-live="polite" aria-atomic="true">
              <!-- Option cards rendered at runtime from data/tube-sizes.json -->
            </div>
          </div>
        </div>
      </section>

      <section id="legs-subsection-leg-finish" class="stage-subsection-dropdown" data-default-expanded="true">
        <button type="button" class="stage-subsection-header" aria-expanded="false" aria-controls="legs-subsection-leg-finish-content">
          <div class="stage-subsection-header-main">
            <div class="stage-subsection-title">Leg finish</div>
          </div>
          <svg class="stage-subsection-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <div id="legs-subsection-leg-finish-content" class="stage-subsection-content" hidden>
          <div class="stage-subsection-body">
            <div id="leg-finish-options" class="stage-options-grid" aria-live="polite" aria-atomic="true">
              <!-- Option cards rendered at runtime from data/leg-finish.json -->
            </div>
          </div>
        </div>
      </section>
    </div>
  </section>

  <!-- Stage 6: Add-ons -->
  <section id="stage-panel-6" class="stage-panel">
    <div id="addons-options" class="addons-dropdown-list" aria-live="polite" aria-atomic="true">
      <!-- Dropdown tiles rendered at runtime from data/addons.json -->
    </div>
  </section>

  <!-- Stage 7: Summary & Export -->
  <section id="stage-panel-7" class="stage-panel">
    <div id="summary-panel" class="summary-stage" data-include="pages/Summary.html"></div>
  </section>
</div>
