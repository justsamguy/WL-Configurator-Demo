<!-- Materials panel: only option containers (stage-specific help moved to components/StageInfo.html) -->
<div id="materials-panel" class="">
  <div id="materials-root" class="stage-subsection-list">
    <section id="tabletop-subsection-wood" class="stage-subsection-dropdown" data-default-expanded="true">
      <button type="button" class="stage-subsection-header" aria-expanded="false" aria-controls="tabletop-subsection-wood-content">
        <div class="stage-subsection-header-main">
          <div class="stage-subsection-title">Wood</div>
        </div>
        <svg class="stage-subsection-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
      <div id="tabletop-subsection-wood-content" class="stage-subsection-content" hidden>
        <div class="stage-subsection-body">
          <div class="stage-subsection-help-row">
            <button
              type="button"
              class="tooltip materials-help-link"
              data-tip='We select wood to match the size of your project and budget. We will inform you of progress as we work on your project, including photos of wood, layout, and color. If you would like to choose which specific slabs are used for your project, select the "Custom" option.'
              aria-describedby="wood-species-tooltip-desc"
            >
              How your wood is chosen
            </button>
            <span id="wood-species-tooltip-desc" class="sr-only">
              We select wood to match the size of your project and budget. We will inform you of progress as we work on your project, including photos of wood, layout, and color. If you would like to choose which specific slabs are used for your project, select the "Custom" option.
            </span>
          </div>
          <div id="materials-options" class="stage-options-grid" aria-live="polite" aria-atomic="true">
            <!-- Option cards are rendered at runtime by js/main.js -> stageRenderer.renderOptionCards -->
          </div>
        </div>
      </div>
    </section>

    <section id="tabletop-subsection-color" class="stage-subsection-dropdown" data-default-expanded="true">
      <button type="button" class="stage-subsection-header" aria-expanded="false" aria-controls="tabletop-subsection-color-content">
        <div class="stage-subsection-header-main">
          <div class="stage-subsection-title">Color</div>
        </div>
        <svg class="stage-subsection-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
      <div id="tabletop-subsection-color-content" class="stage-subsection-content" hidden>
        <div class="stage-subsection-body">
          <div id="color-options" class="stage-options-grid" aria-live="polite" aria-atomic="true">
            <!-- Color option cards rendered at runtime from data/colors.json via main.js -> stageRenderer.renderOptionCards -->
          </div>
        </div>
      </div>
    </section>

    <section id="tabletop-subsection-color-gradient" class="stage-subsection-dropdown" data-default-expanded="true">
      <button type="button" class="stage-subsection-header" aria-expanded="false" aria-controls="tabletop-subsection-color-gradient-content">
        <div class="stage-subsection-header-main">
          <div class="stage-subsection-title">Color Gradient</div>
        </div>
        <svg class="stage-subsection-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
      <div id="tabletop-subsection-color-gradient-content" class="stage-subsection-content" hidden>
        <div class="stage-subsection-body">
          <div id="color-gradient-options" class="stage-options-grid" aria-live="polite" aria-atomic="true">
            <!-- Color gradient option cards rendered at runtime from data/color-gradients.json via main.js -> stageRenderer.renderOptionCards -->
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
