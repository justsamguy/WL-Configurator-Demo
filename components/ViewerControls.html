<!-- Controls Bar -->
<div id="viewer-controls" class="viewer-controls" aria-label="3D viewer controls">
  <div class="viewer-control-group" aria-label="Orbit controls">
    <div class="viewer-control-buttons">
      <button id="viewer-orbit-left" type="button" class="control-btn" aria-label="Orbit camera left">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M15 6l-6 6 6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button id="viewer-orbit-right" type="button" class="control-btn" aria-label="Orbit camera right">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <span class="viewer-control-label">Orbit</span>
  </div>

  <div class="viewer-control-group" aria-label="Zoom controls">
    <div class="viewer-control-buttons">
      <button id="viewer-zoom-in" type="button" class="control-btn" aria-label="Zoom in">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <button id="viewer-zoom-out" type="button" class="control-btn" aria-label="Zoom out">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M5 12h14" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <span class="viewer-control-label">Zoom</span>
  </div>

  <div class="viewer-control-group" aria-label="Reset controls">
    <div class="viewer-control-buttons">
      <button id="reset-view" type="button" class="control-btn" aria-label="Reset camera view">
        <i class="fa-solid fa-arrow-rotate-right" aria-hidden="true"></i>
      </button>
    </div>
    <span class="viewer-control-label">Reset</span>
  </div>

  <div class="viewer-control-group viewer-exit-group" aria-label="Exit preview controls">
    <div class="viewer-control-buttons">
      <button id="mobile-viewer-exit" type="button" class="control-btn viewer-exit-btn" aria-label="Exit 3D preview and open menu">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
    <span class="viewer-control-label">EXIT</span>
  </div>
</div>
