<div class="flex flex-col gap-6 px-8 py-8">
  <!-- Models Stage Section -->
  <div id="models-stage-section">
    <div class="model-row-grid">
      <button class="option-card" data-id="mdl-coffee" aria-pressed="false">
        <img src="assets/images/Black Walnut Multi-Grey Round Coffee Table.webp" alt="Coffee Table placeholder" class="viewer-placeholder-img" />
        <div class="title">Coffee Table</div>
        <div class="description">Compact, intimate seating solution.</div>
      </button>
      <button class="option-card" data-id="mdl-dining" aria-pressed="false">
        <img src="assets/images/Black Walnut Multi-Grey Dining Table with Rounded Corners.webp" alt="Dining Table" class="viewer-placeholder-img" />
        <div class="title">Dining Table</div>
        <div class="description">Spacious, family-friendly.</div>
      </button>
      <button class="option-card" data-id="mdl-conference" aria-pressed="false">
        <img src="assets/images/Black Walnut Blue River Conference Table with Islands.webp" alt="Conference Table" class="viewer-placeholder-img" />
        <div class="title">Conference Table</div>
        <div class="description">Professional, boardroom style.</div>
      </button>
    </div>
  </div>

  <!-- Designs Stage Section -->
  <!-- Note: Design options are dynamically rendered from data/designs.json and filtered based on selected model.
       Each design's availability is determined by the "prices" object - if a design has pricing for a specific
       model ID (e.g., "mdl-coffee", "mdl-dining", "mdl-conference"), it will be shown for that model.
       To add a new design: add it to data/designs.json with appropriate pricing for each compatible model. -->
  <div id="designs-stage-section">
    <div class="designs-stage-group designs-stage-group-presets is-open" data-group-type="presets">
      <button class="designs-stage-toggle" type="button" aria-expanded="true" aria-controls="design-presets-panel">
        <span class="designs-stage-heading">Customize a design</span>
        <span class="designs-stage-toggle-trailing" aria-hidden="true">
          <span class="designs-stage-toggle-caption">Presets</span>
          <svg class="designs-stage-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"></path>
          </svg>
        </span>
      </button>
      <div id="design-presets-panel" class="designs-stage-panel" aria-hidden="false">
        <div class="designs-stage-panel-inner">
          <div id="design-presets-options" class="stage-options-grid">
            <!-- Preset design cards will be dynamically rendered here based on selected model -->
          </div>
        </div>
      </div>
    </div>
    <div class="designs-stage-group designs-stage-group-layouts" data-group-type="layouts">
      <button class="designs-stage-toggle" type="button" aria-expanded="false" aria-controls="design-layout-panel">
        <span class="designs-stage-heading">Build from a layout</span>
        <span class="designs-stage-toggle-trailing" aria-hidden="true">
          <span class="designs-stage-toggle-caption">Layouts</span>
          <svg class="designs-stage-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"></path>
          </svg>
        </span>
      </button>
      <div id="design-layout-panel" class="designs-stage-panel" aria-hidden="true">
        <div class="designs-stage-panel-inner">
          <div id="design-layout-options" class="stage-options-grid">
            <!-- Layout design cards will be dynamically rendered here based on selected model -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
